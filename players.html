<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tachkila</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="players.js" defer></script>

</head>


<body class="bg-slate-900 text-white">


    <header class=" bg-slate-900 font-bold border-b-1 border-slate-700 ">
        <div class="flex h-20 items-center justify-between ml-5 mr-5">
            <div class=" flex  items-center justify-between gap-2">
                <img src="img/logo.png.png" width="40PX" height="40PX" alt="">

                <H1 class="text-[30px]" text-wh>TACHKILA</H1>
            </div>

            <nav
                class="flex justify-center justify-between items-center border-1 p-2  px-6 rounded-2xl bg-slate-800 border-slate-700   ">

                <ul class="flex justify-center justify-between items-center gap-8 ">

                    <li><a href="players.html" class="block px-4 py-2 rounded-xl bg-green-500 text-white ">Players</a>
                    </li>
                    <li><a href="composition.html"
                            class="block px-4 py-2 rounded-xl text-slate-300 hover:text-white">Composition</a></li>
                    <li><a href="matches.html"
                            class="block px-4 py-2 rounded-xl text-slate-300 hover:text-white">Matches</a></li>

                </ul>

            </nav>



            <div>
                <nav class=" ">
                    <ul class="md:flex md:items-center md:gap-3 justify-center">
                        <DIV class="border border-amber-500 rounded-[10vw] w-3 h-3 bg-amber-500 font-bold"></div>
                        <li class="text-amber-500"> GB</li>
                        <DIV class="border border-blue-500 rounded-[10vw] w-3 h-3 bg-blue-500 font-bold"></div>
                        <li class="text-blue-500"> DEF</li>
                        <DIV class="border border-green-500 rounded-[10vw] w-3 h-3 bg-green-500 font-bold"></div>
                        <li class="text-green-500"> MIL</li>
                        <DIV class="border border-red-500 rounded-[10vw] w-3 h-3 bg-red-500 font-bold"></div>
                        <li class="text-red-500"> ATT</li>
                    </ul>
                </nav>



            </div>

        </div>

    </header>



    <main class="flex  px-6 flex-col gap-2 ">


        <div
            class=" flex  w-full border-r border-slate-900 bg-slate-900 justify-between justify-between items-center h-25">

            <div class=" flex justify-center justify-between gap-2 text-white font-bold text-4xl flex-col ">
                <h2>Players</h2>
                <p class="text-sm text-slate-500 font-  ">Manage players of Atlas FC club</p>

            </div>


            <button id="openmodal"
                class="w- rounded-2xl bg-green-500 py-2 px-4   text-xl font-bold  justify-center flex items-center">
                + Add a player
            </button>

        </div>

        <div class=" grid grid-cols-4    gap-4 h-24  ">


            <div class=" flex border-1 rounded-xl items-center justify-center bg-slate-800  border-slate-800"> 1</div>
            <div class="flex border-1 rounded-xl items-center justify-center bg-slate-800  border-slate-800"> 2</div>
            <div class="flex border-1 rounded-xl items-center justify-center bg-slate-800  border-slate-800">3 </div>
            <div class="flex border-1 rounded-xl items-center justify-center bg-slate-800  border-slate-800 ">4 </div>

        </div>



        <div class=" flex justify-between border-1 rounded-xl border-slate-800 bg-slate-800 items-center p-3 gap-6 ">

            <div class=" flex w-full">


                <form action="search" class=" flex w-full">

                    <input type="text" placeholder="text-slate-500"
                        class="  bg-slate-900 rounded-lg border-2 w-full border-slate-800 p-4 ">

                </form>


            </div>

            <div
                class="flex justify-center justify-between items-center border-1  rounded-2xl bg-slate-800 border-slate-700  p-2 px-4  ">

                <ul class="flex justify-center justify-between items-center gap-8 ">

                    <li><a href="#">Tous</a></li>
                    <li><a href="#">Gb</a></li>
                    <li><a href="#">Def</a></li>
                    <li><a href="#">Mil</a></li>
                    <li><a href="#">Att</a></li>

                </ul>

            </div>

        </div>












    </main>


    <div id="playermodal"
        class=" flex items-center justify-center min-h-screen fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 ">

        <form class=" w-full max-w-[560px] p-8 space-y-6 rounded-2xl bg-slate-800 border border-slate-700 ">

            <div class="flex justify-between items-center">
                <h1 class="text-white text-xl font-bold">Ajouter un joueur</h1>

                <button id="closemodal" type="button" class="text-slate-400 hover:text-white text-xl">
                    ✕
                </button>
            </div>

            <div>
                <label class="block text-white font-bold mb-2" for="player-name">Nom complet</label>
                <input type="text" id="player-name" name="name" required
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-white font-bold mb-2" for="player-number">Numéro</label>
                    <input type="number" min="1" max="99" id="player-number" required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div>
                    <label class="block text-white font-bold mb-2" for="player-role">Poste</label>
                    <select id="player-role" required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="">Choisir un poste</option>
                        <option value="gardien">Gardien</option>
                        <option value="defenseur">Défenseur</option>
                        <option value="milieu">Milieu</option>
                        <option value="attaquant">Attaquant</option>
                    </select>
                </div>

                <div>
                    <label class="block text-white font-bold mb-2" for="player-age">Âge</label>
                    <input type="number" min="15" max="50" id="player-age" required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div>
                    <label class="block text-white font-bold mb-2" for="player-status">Statut</label>
                    <select id="player-status"
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="En forme">En forme</option>
                        <option value="Blessé">Blessé</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <button type="button" id="anuller-button"
                    class="bg-slate-800 text-white font-bold rounded-xl border border-slate-600 px-6 py-2.5">
                    Annuler
                </button>

                <button id="ajouter"
                    class="bg-green-500 text-white font-bold rounded-xl border border-green-500 px-6 py-2.5">
                    Enregistrer
                </button>
            </div>

        </form>
    </div>


    </div>

    <template id="player-template">
        <div
            class="player-card relative flex flex-col gap-4 rounded-xl border border-l-4 border-slate-700 bg-slate-800 p-5">


            <span
                class="captain-badge absolute -top-3 -right-3 flex size-7 items-center justify-center rounded-full bg-purple-500 text-sm font-bold">C</span>

            <div class="flex items-center gap-4">
                <span
                    class="player-number flex size-12 shrink-0 items-center justify-center rounded-full border-2 text-xl font-bold"></span>
                <div class="min-w-0">
                    <h3 class="player-name truncate text-lg font-bold"></h3>
                    <span class="player-role rounded px-2 py-0.5 text-sm font-bold"></span>
                </div>
            </div>

            <p class="player-age text-slate-400"></p>

            <div class="flex items-center justify-between">
                <span class="player-status rounded px-2 py-1 text-sm font-bold"></span>

                <div class="flex items-center gap-3">
                    <button type="button"
                        class="captain-btn size-10 rounded-lg border border-slate-600 font-bold">C</button>

                    <button type="button"
                        class="edit-btn rounded-lg bg-blue-500 px-3 py-1 hover:bg-blue-600">Modifier</button>
                    <button type="button"
                        class="delete-btn rounded-lg bg-red-500 px-3 py-1 hover:bg-red-600">Supprimer</button>
                </div>
            </div>
        </div>
    </template>






</body>

</html>
